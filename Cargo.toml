[package]
name = "overwatch"
version = "0.1.0"
edition = "2021"
authors = ["w01f"]
description = "Comprehensive system health assessment tool"

[[bin]]
name = "0verwatch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sysinfo = "0.32"
toml = "0.8"
libc = "0.2"
# rustls (not native-tls/OpenSSL) keeps the binary portable and easy to
# cross-compile to a static musl build for the VPS fleet.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
strip = true